root:
  reposDir: "./repos"
  worktreesDir: "./worktrees"
  outputsDir: "./outputs"
  locksDir: "./locks"

jira:
  baseUrl: "${JIRA_BASE_URL}"
  email: "${JIRA_EMAIL}"
  apiToken: "${JIRA_API_TOKEN}"
  # "3" = Jira Cloud (ADF descriptions), "2" = Jira Server/Data Center.
  apiVersion: "3"

bitbucket:
  # Real NLS Bitbucket is CLOUD (bitbucket.org/nls-kz). The Cloud client talks to
  # REST API 2.0 (https://api.bitbucket.org/2.0) with Basic auth
  # (BITBUCKET_USERNAME + BITBUCKET_TOKEN — an app password / API token).
  # PR lookup is best-effort: on any failure (auth, network, no PR) the run
  # degrades to a branch-only review. Set type "datacenter" + baseUrl for on-prem.
  type: "cloud"
  workspace: "nls-kz"
  baseUrl: "${BITBUCKET_BASE_URL}"
  username: "${BITBUCKET_USERNAME}"
  token: "${BITBUCKET_TOKEN}"

# Claude CLI run mode (mirrors the manual CR command:
#   claude --dangerously-skip-permissions --effort max --model opus).
# Defaults if unset: bin=claude, model=opus, effort=max,
# permissionMode=dangerously-skip-permissions, outputFormat=json.
claude:
  bin: "${CLAUDE_BIN}"
  model: "${CLAUDE_MODEL}"
  effort: "${CLAUDE_EFFORT}"
  permissionMode: "${CLAUDE_PERMISSION_MODE}"
  outputFormat: "${CLAUDE_OUTPUT_FORMAT}"
  # maxTurns is optional and intentionally NOT set (closest to the manual run).
  # Uncomment to cap turns: maxTurns: 12

# IMPORTANT: the top-level key under `repos` is the repo id (used for worktree /
# output / lock paths and for --repo), NOT the Jira prefix. One Jira prefix can
# map to several repositories — then --repo is required to disambiguate.
#
# Cloud addresses repos by workspace + repoSlug. The global bitbucket.workspace
# ("nls-kz") applies to every repo; override per-repo with bitbucket.workspace.
# repoSlug MUST match the Bitbucket Cloud repository slug. projectKey is used only
# by the Data Center client and is ignored in cloud mode.
#
# Repo dirs not yet cloned are marked "# (clone needed)". `sync`/`run` will tell
# you to clone them when used.
repos:
  # ---- SC: Support Center ----
  frontend-support-center.netcore.kz:
    jiraPrefixes: ["SC"]
    path: "./repos/frontend-support-center.netcore.kz"
    defaultBaseBranch: "origin/master"
    bitbucket: { workspace: "nls-kz", repoSlug: "frontend-support-center.netcore.kz" }

  # ---- BILL: Billing ----
  frontend-billing.netcore.kz:
    jiraPrefixes: ["BILL"]
    path: "./repos/frontend-billing.netcore.kz"
    defaultBaseBranch: "origin/main" # this repo uses main, not master
    bitbucket: { projectKey: "BILL", repoSlug: "frontend-billing.netcore.kz" }

  # ---- CRMMEG: CRM Meganet (2 repos) ----
